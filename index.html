<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Календарь соревнований O-Time</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-primary: #0f172a;
      --text-secondary: #475569;
      --text-muted: #94a3b8;
      
      --accent: #4f46e5;
      --accent-hover: #4338ca;
      --accent-light: #eef2ff;
      
      --danger: #f43f5e;
      --danger-light: #ffe4e6;
      
      --border-color: #e2e8f0;
      --radius: 12px;
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
      --shadow-md: 0 4px 12px rgba(0,0,0,0.05);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-primary);
      padding: 16px;
      min-height: 100vh;
      line-height: 1.5;
    }

    .app-container {
      max-width: 1100px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* Шапка сайта */
    header {
      background: var(--card-bg);
      padding: 16px 20px;
      border-radius: var(--radius);
      border: 1px solid var(--border-color);
      box-shadow: var(--shadow-sm);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      font-size: 1.25rem;
      color: var(--text-primary);
      letter-spacing: -0.5px;
    }

    .logo i {
      color: var(--accent);
      font-size: 1.5rem;
    }

    /* Панель управления и фильтры */
    .controls {
      background: var(--card-bg);
      padding: 12px;
      border-radius: var(--radius);
      border: 1px solid var(--border-color);
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .filters-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .filter-btn {
      background: #f1f5f9;
      border: 1px solid transparent;
      color: var(--text-secondary);
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.85rem;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }

    .filter-btn:hover {
      background: #e2e8f0;
      color: var(--text-primary);
    }

    .filter-btn.active {
      background: var(--accent);
      color: #ffffff;
    }

    .filter-btn.favorites-tab {
      margin-left: auto;
      color: var(--danger);
      background: var(--danger-light);
    }

    .filter-btn.favorites-tab.active {
      background: var(--danger);
      color: #ffffff;
    }

    .badge {
      background: rgba(0,0,0,0.1);
      padding: 2px 6px;
      border-radius: 6px;
      font-size: 0.75rem;
    }

    /* Виджет сетки календаря */
    .calendar-widget {
      background: var(--card-bg);
      border-radius: var(--radius);
      border: 1px solid var(--border-color);
      padding: 16px;
      box-shadow: var(--shadow-sm);
    }

    .calendar-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .month-title {
      font-weight: 700;
      font-size: 1rem;
      color: var(--text-primary);
    }

    .cal-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
      text-align: center;
    }

    .cal-day-name {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--text-muted);
      padding: 6px 0;
    }

    .cal-date {
      aspect-ratio: 1;
      padding: 4px;
      border-radius: 8px;
      border: 1px solid transparent;
      background: #f8fafc;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      transition: all 0.15s ease;
      position: relative;
    }

    .cal-date:hover {
      border-color: var(--accent);
      background: var(--accent-light);
    }

    .cal-date.empty {
      background: transparent;
      cursor: default;
    }

    .cal-date.has-events {
      background: #ffffff;
      border-color: var(--border-color);
    }

    .cal-date.selected {
      background: var(--accent) !important;
      color: #ffffff !important;
    }

    .event-dots {
      display: flex;
      gap: 2px;
      margin-top: 2px;
    }

    .event-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background-color: var(--accent);
    }

    .cal-date.selected .event-dot {
      background-color: #ffffff;
    }

    /* Сетка карточек */
    .events-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
    }

    /* Стильная карточка соревнований */
    .event-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: var(--shadow-sm);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .event-card:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
    }

    /* Векторная заглушка баннера */
    .card-banner {
      height: 90px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      font-size: 2.2rem;
    }

    .banner-run { background: linear-gradient(135deg, #6366f1, #8b5cf6); }
    .banner-ski { background: linear-gradient(135deg, #0ea5e9, #0284c7); }
    .banner-swim { background: linear-gradient(135deg, #06b6d4, #0891b2); }
    .banner-bike { background: linear-gradient(135deg, #f59e0b, #d97706); }
    .banner-other { background: linear-gradient(135deg, #64748b, #475569); }

    .fav-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(255, 255, 255, 0.9);
      border: none;
      color: var(--text-muted);
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .fav-btn:hover {
      transform: scale(1.1);
      background: #ffffff;
    }

    .fav-btn.is-fav {
      color: var(--danger);
    }

    .card-body {
      padding: 14px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
      justify-content: space-between;
      gap: 12px;
    }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .event-date-badge {
      background: var(--accent-light);
      color: var(--accent);
      font-weight: 700;
      font-size: 0.8rem;
      padding: 3px 8px;
      border-radius: 6px;
    }

    .event-title {
      font-size: 0.98rem;
      font-weight: 700;
      color: var(--text-primary);
      line-height: 1.35;
    }

    .event-location {
      font-size: 0.82rem;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .register-btn {
      display: block;
      text-align: center;
      background: var(--accent);
      color: #ffffff;
      padding: 8px 12px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.85rem;
      transition: background 0.2s ease;
    }

    .register-btn:hover {
      background: var(--accent-hover);
    }

    .empty-msg {
      text-align: center;
      padding: 30px;
      background: var(--card-bg);
      border-radius: var(--radius);
      border: 1px solid var(--border-color);
      color: var(--text-secondary);
    }

    .reset-date-btn {
      background: transparent;
      border: none;
      color: var(--accent);
      font-weight: 600;
      cursor: pointer;
      font-size: 0.8rem;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <header>
      <div class="logo">
        <i class="fa-solid fa-stopwatch"></i>
        <span>O-TIME CALENDAR</span>
      </div>
    </header>

    <!-- Фильтры по видам спорта -->
    <div class="controls">
      <div class="filters-row" id="sport-filters">
        <button class="filter-btn active" data-type="all">
          <i class="fa-solid fa-border-all"></i> Все
        </button>
        <button class="filter-btn" data-type="run">
          <i class="fa-solid fa-person-running"></i> Бег / Трейл
        </button>
        <button class="filter-btn" data-type="ski">
          <i class="fa-solid fa-person-skiing"></i> Лыжи
        </button>
        <button class="filter-btn" data-type="swim">
          <i class="fa-solid fa-person-swimming"></i> Плавание
        </button>
        <button class="filter-btn" data-type="bike">
          <i class="fa-solid fa-person-biking"></i> Вело
        </button>
        <button class="filter-btn" data-type="other">
          <i class="fa-solid fa-trophy"></i> Другое
        </button>
        <button class="filter-btn favorites-tab" data-type="favorites">
          <i class="fa-solid fa-heart"></i> Избранное <span class="badge" id="fav-count">0</span>
        </button>
      </div>
    </div>

    <!-- Календарь на месяц -->
    <div class="calendar-widget">
      <div class="calendar-header">
        <span class="month-title" id="month-name">Август 2026</span>
        <button class="reset-date-btn" id="reset-date" style="display: none;">Показать все даты</button>
      </div>
      <div class="cal-grid" id="calendar-grid"></div>
    </div>

    <!-- Список соревнований -->
    <main id="events-container">
      <div class="events-grid" id="events-grid"></div>
    </main>
  </div>

  <script>
    // База соревнований (мгновенная загрузка)
    const eventsData = [
      { id: 'ev1', title: "Марафон «Европа-Азия»", date: "2026-08-15", location: "Екатеринбург", type: "run", link: "https://reg.o-time.ru/calendar" },
      { id: 'ev2', title: "Лесной трейл «Небо Славян»", date: "2026-08-20", location: "Ленинградская обл.", type: "run", link: "https://reg.o-time.ru/calendar" },
      { id: 'ev3', title: "Ночной забег O-Time", date: "2026-08-20", location: "Санкт-Петербург", type: "run", link: "https://reg.o-time.ru/calendar" },
      { id: 'ev4', title: "Открытый заплыв Lake Swim", date: "2026-08-23", location: "Озеро Хепоярви", type: "swim", link: "https://reg.o-time.ru/calendar" },
      { id: 'ev5', title: "Шоссейная велогонка Gran Fondo", date: "2026-08-28", location: "Москва", type: "bike", link: "https://reg.o-time.ru/calendar" },
      { id: 'ev6', title: "Лыжероллерный спринт", date: "2026-08-30", location: "Кавголово", type: "ski", link: "https://reg.o-time.ru/calendar" }
    ];

    let favorites = JSON.parse(localStorage.getItem('otime_favs') || '[]');
    let currentFilter = 'all';
    let selectedDate = null;

    const icons = {
      run: 'fa-person-running',
      ski: 'fa-person-skiing',
      swim: 'fa-person-swimming',
      bike: 'fa-person-biking',
      other: 'fa-trophy'
    };

    function init() {
      updateFavBadge();
      renderCalendarGrid();
      renderEvents();
    }

    // Рендер сетки календаря
    function renderCalendarGrid() {
      const grid = document.getElementById('calendar-grid');
      const daysNames = ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'];
      
      let html = daysNames.map(d => `<div class="cal-day-name">${d}</div>`).join('');

      // Август 2026 начинается с субботы (5 пустых ячеек)
      for (let i = 0; i < 5; i++) {
        html += `<div class="cal-date empty"></div>`;
      }

      for (let day = 1; day <= 31; day++) {
        const dateStr = `2026-08-${day < 10 ? '0' + day : day}`;
        const dayEvents = eventsData.filter(e => e.date === dateStr);
        const hasEvents = dayEvents.length > 0;
        const isSelected = selectedDate === dateStr;

        html += `
          <div class="cal-date ${hasEvents ? 'has-events' : ''} ${isSelected ? 'selected' : ''}" 
               onclick="selectDate('${dateStr}')">
            <span>${day}</span>
            <div class="event-dots">
              ${dayEvents.map(() => `<div class="event-dot"></div>`).join('')}
            </div>
          </div>
        `;
      }

      grid.innerHTML = html;
    }

    function selectDate(dateStr) {
      if (selectedDate === dateStr) {
        selectedDate = null;
        document.getElementById('reset-date').style.display = 'none';
      } else {
        selectedDate = dateStr;
        document.getElementById('reset-date').style.display = 'inline-block';
      }
      renderCalendarGrid();
      renderEvents();
    }

    document.getElementById('reset-date').addEventListener('click', () => {
      selectedDate = null;
      document.getElementById('reset-date').style.display = 'none';
      renderCalendarGrid();
      renderEvents();
    });

    function toggleFavorite(id) {
      if (favorites.includes(id)) {
        favorites = favorites.filter(favId => favId !== id);
      } else {
        favorites.push(id);
      }
      localStorage.setItem('otime_favs', JSON.stringify(favorites));
      updateFavBadge();
      renderEvents();
    }

    function updateFavBadge() {
      document.getElementById('fav-count').textContent = favorites.length;
    }

    function renderEvents() {
      const container = document.getElementById('events-grid');
      let filtered = [...eventsData];

      // Фильтр по спорту / избранному
      if (currentFilter === 'favorites') {
        filtered = filtered.filter(e => favorites.includes(e.id));
      } else if (currentFilter !== 'all') {
        filtered = filtered.filter(e => e.type === currentFilter);
      }

      // Фильтр по выбранной в календаре дате
      if (selectedDate) {
        filtered = filtered.filter(e => e.date === selectedDate);
      }

      // Сортировка по дате
      filtered.sort((a, b) => new Date(a.date) - new Date(b.date));

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="empty-msg" style="grid-column: 1/-1;">
            Мероприятий по выбранным параметрам не найдено.
          </div>
        `;
        return;
      }

      container.innerHTML = filtered.map(event => {
        const isFav = favorites.includes(event.id);
        const iconClass = icons[event.type] || 'fa-trophy';
        const formattedDate = event.date.split('-').reverse().join('.');

        return `
          <div class="event-card">
            <div class="card-banner banner-${event.type}">
              <i class="fa-solid ${iconClass}"></i>
              <button class="fav-btn ${isFav ? 'is-fav' : ''}" onclick="toggleFavorite('${event.id}')">
                <i class="${isFav ? 'fa-solid' : 'fa-regular'} fa-heart"></i>
              </button>
            </div>
            <div class="card-body">
              <div>
                <div class="card-header">
                  <span class="event-date-badge">${formattedDate}</span>
                </div>
                <div class="event-title" style="margin-top: 8px;">${event.title}</div>
              </div>
              <div class="event-location">
                <i class="fa-solid fa-location-dot"></i> ${event.location}
              </div>
              <a href="${event.link}" target="_blank" class="register-btn">Регистрация</a>
            </div>
          </div>
        `;
      }).join('');
    }

    // Обработчик переключения фильтров
    document.getElementById('sport-filters').addEventListener('click', (e) => {
      const btn = e.target.closest('.filter-btn');
      if (!btn) return;

      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');

      currentFilter = btn.dataset.type;
      renderEvents();
    });

    init();
  </script>
</body>
</html>
