<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Планы на спорт</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --card-bg-hover: #334155;
      --text-primary: #f8fafc;
      --text-secondary: #cbd5e1;
      --text-muted: #64748b;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --accent-light: rgba(99, 102, 241, 0.2);
      --danger: #f43f5e;
      --danger-light: rgba(244, 63, 94, 0.2);
      --border-color: #334155;
      --radius: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-primary);
      padding: 16px;
      min-height: 100vh;
      line-height: 1.5;
    }

    .app-container {
      max-width: 1100px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    header {
      background: var(--card-bg);
      padding: 14px 20px;
      border-radius: var(--radius);
      border: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .menu-toggle-btn {
      background: var(--accent);
      border: none;
      color: #ffffff;
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 800;
      font-size: 1.2rem;
      color: var(--text-primary);
    }

    .logo i { color: var(--accent); }

    /* Оверлей и выдвижное меню */
    .sidebar-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(4px);
      z-index: 999;
      display: none;
    }

    .sidebar-overlay.active { display: block; }

    .sidebar {
      position: fixed;
      top: 0;
      left: -330px;
      width: 310px;
      height: 100%;
      background: var(--card-bg);
      border-right: 1px solid var(--border-color);
      z-index: 1000;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      transition: left 0.3s ease;
      overflow-y: auto;
    }

    .sidebar.active { left: 0; }

    .sidebar-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 12px;
    }

    .sidebar-title { font-weight: 700; font-size: 1.1rem; }

    .close-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 1.2rem;
      cursor: pointer;
    }

    /* Календарь */
    .month-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .month-nav-btn {
      background: var(--border-color);
      border: none;
      color: var(--text-primary);
      width: 32px;
      height: 32px;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .month-title { font-weight: 700; font-size: 0.95rem; color: var(--text-secondary); }

    .cal-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
      text-align: center;
    }

    .cal-day-name {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--text-muted);
      padding: 4px 0;
    }

    .cal-date {
      aspect-ratio: 1;
      padding: 4px;
      border-radius: 8px;
      border: 1px solid transparent;
      background: #0f172a;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-secondary);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
    }

    .cal-date.empty { background: transparent; cursor: default; }
    .cal-date.has-events { border-color: var(--border-color); color: #fff; }
    .cal-date.selected { background: var(--accent) !important; color: #ffffff !important; }

    .event-dots { display: flex; gap: 2px; margin-top: 2px; }
    .event-dot { width: 4px; height: 4px; border-radius: 50%; background-color: var(--accent); }
    .cal-date.selected .event-dot { background-color: #ffffff; }

    .reset-date-btn {
      width: 100%;
      background: var(--border-color);
      border: none;
      color: var(--text-primary);
      padding: 10px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.85rem;
    }

    /* Фильтры */
    .controls {
      background: var(--card-bg);
      padding: 12px;
      border-radius: var(--radius);
      border: 1px solid var(--border-color);
    }

    .filters-row { display: flex; flex-wrap: wrap; gap: 8px; }

    .filter-btn {
      background: #0f172a;
      border: 1px solid var(--border-color);
      color: var(--text-secondary);
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.85rem;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .filter-btn.active { background: var(--accent); color: #ffffff; border-color: var(--accent); }
    .filter-btn.favorites-tab { margin-left: auto; color: var(--danger); background: var(--danger-light); border-color: transparent; }
    .filter-btn.favorites-tab.active { background: var(--danger); color: #ffffff; }

    .badge { background: rgba(255, 255, 255, 0.2); padding: 2px 6px; border-radius: 6px; font-size: 0.75rem; }

    .active-date-info {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--accent-light);
      border: 1px solid var(--accent);
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 0.88rem;
    }

    /* Сетка и Карточки */
    .events-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
    }

    .event-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .card-banner {
      height: 90px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      font-size: 2.2rem;
    }

    .banner-run { background: linear-gradient(135deg, #4f46e5, #3b82f6); }
    .banner-ski { background: linear-gradient(135deg, #0284c7, #06b6d4); }
    .banner-swim { background: linear-gradient(135deg, #0d9488, #10b981); }
    .banner-bike { background: linear-gradient(135deg, #d97706, #f59e0b); }
    .banner-other { background: linear-gradient(135deg, #475569, #64748b); }

    .fav-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(15, 23, 42, 0.75);
      border: none;
      color: var(--text-muted);
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .fav-btn.is-fav { color: var(--danger); }

    .card-body {
      padding: 14px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
      justify-content: space-between;
      gap: 12px;
    }

    .card-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .event-date-badge {
      background: var(--accent-light);
      color: #818cf8;
      font-weight: 700;
      font-size: 0.8rem;
      padding: 3px 8px;
      border-radius: 6px;
    }

    .event-source {
      font-size: 0.75rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    .event-title {
      font-size: 0.98rem;
      font-weight: 700;
      color: var(--text-primary);
      line-height: 1.35;
      margin-top: 6px;
    }

    .event-location {
      font-size: 0.82rem;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .register-btn {
      display: block;
      text-align: center;
      background: var(--accent);
      color: #ffffff;
      padding: 9px 12px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.85rem;
    }

    .empty-msg {
      text-align: center;
      padding: 40px;
      background: var(--card-bg);
      border-radius: var(--radius);
      border: 1px solid var(--border-color);
      color: var(--text-secondary);
    }
  </style>
</head>
<body>

  <div class="sidebar-overlay" id="overlay" onclick="closeSidebar()"></div>

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-title"><i class="fa-regular fa-calendar-days"></i> Календарь</div>
      <button class="close-btn" onclick="closeSidebar()"><i class="fa-solid fa-xmark"></i></button>
    </div>

    <div>
      <div class="month-nav">
        <button class="month-nav-btn" onclick="changeMonth(-1)"><i class="fa-solid fa-chevron-left"></i></button>
        <div class="month-title" id="month-title">Август 2026</div>
        <button class="month-nav-btn" onclick="changeMonth(1)"><i class="fa-solid fa-chevron-right"></i></button>
      </div>
      <div class="cal-grid" id="calendar-grid"></div>
      <button class="reset-date-btn" id="reset-date" style="display: none; margin-top: 12px;" onclick="clearDateFilter()">Показать все дни</button>
    </div>
  </aside>

  <div class="app-container">
    <header>
      <div class="header-left">
        <button class="menu-toggle-btn" onclick="openSidebar()">
          <i class="fa-solid fa-bars"></i>
          <span>Календарь</span>
        </button>
        <div class="logo">
          <i class="fa-solid fa-stopwatch"></i>
          <span>Планы на спорт</span>
        </div>
      </div>
    </header>

    <div id="date-info-bar" style="display: none;">
      <div class="active-date-info">
        <span>Показаны старты на: <strong id="selected-date-text"></strong></span>
        <button class="close-btn" onclick="clearDateFilter()"><i class="fa-solid fa-xmark"></i></button>
      </div>
    </div>

    <div class="controls">
      <div class="filters-row" id="sport-filters">
        <button class="filter-btn active" data-type="all"><i class="fa-solid fa-border-all"></i> Все</button>
        <button class="filter-btn" data-type="run"><i class="fa-solid fa-person-running"></i> Бег / Трейл</button>
        <button class="filter-btn" data-type="ski"><i class="fa-solid fa-person-skiing"></i> Лыжи</button>
        <button class="filter-btn" data-type="swim"><i class="fa-solid fa-person-swimming"></i> Плавание</button>
        <button class="filter-btn" data-type="bike"><i class="fa-solid fa-person-biking"></i> Вело</button>
        <button class="filter-btn" data-type="other"><i class="fa-solid fa-trophy"></i> Другое</button>
        <button class="filter-btn favorites-tab" data-type="favorites"><i class="fa-solid fa-heart"></i> Избранное <span class="badge" id="fav-count">0</span></button>
      </div>
    </div>

    <main id="events-container">
      <div class="events-grid" id="events-grid"></div>
    </main>
  </div>

  <script>
    var eventsData = [
      { id: 'ev1', title: 'Марафон «Европа-Азия»', date: '2026-08-15', location: 'Екатеринбург', type: 'run', source: 'O-Time', link: 'https://reg.o-time.ru/calendar' },
      { id: 'ev2', title: 'Лесной трейл «Небо Славян»', date: '2026-08-20', location: 'Ленинградская обл.', type: 'run', source: 'O-Time', link: 'https://reg.o-time.ru/calendar' },
      { id: 'ev3', title: 'Ночной забег O-Time', date: '2026-08-20', location: 'Санкт-Петербург', type: 'run', source: 'O-Time', link: 'https://reg.o-time.ru/calendar' },
      { id: 'ev4', title: 'Полумарафон «Лужники»', date: '2026-08-23', location: 'Москва', type: 'run', source: 'Russia Running', link: 'https://russiarunning.com' },
      { id: 'ev5', title: 'Открытый заплыв Lake Swim', date: '2026-08-23', location: 'Озеро Хепоярви', type: 'swim', source: 'O-Time', link: 'https://reg.o-time.ru/calendar' },
      { id: 'ev6', title: 'Шоссейная велогонка Gran Fondo', date: '2026-08-28', location: 'Москва', type: 'bike', source: 'O-Time', link: 'https://reg.o-time.ru/calendar' },
      { id: 'ev7', title: 'Лыжероллерный спринт', date: '2026-08-30', location: 'Кавголово', type: 'ski', source: 'O-Time', link: 'https://reg.o-time.ru/calendar' },
      { id: 'ev8', title: 'Московский Марафон', date: '2026-09-06', location: 'Москва', type: 'run', source: 'Russia Running', link: 'https://russiarunning.com' },
      { id: 'ev9', title: 'Павловский полумарафон', date: '2026-09-13', location: 'Санкт-Петербург', type: 'run', source: 'O-Time', link: 'https://reg.o-time.ru/calendar' },
      { id: 'ev10', title: 'Заплыв Swimcup Volga', date: '2026-09-20', location: 'Нижний Новгород', type: 'swim', source: 'Russia Running', link: 'https://russiarunning.com' },
      { id: 'ev11', title: 'Осенний трейл «Северная Тропа»', date: '2026-10-04', location: 'Токсово', type: 'run', source: 'O-Time', link: 'https://reg.o-time.ru/calendar' },
      { id: 'ev12', title: 'Кросс Наций', date: '2026-10-11', location: 'Сочи', type: 'run', source: 'Russia Running', link: 'https://russiarunning.com' }
    ];

    var favorites = JSON.parse(localStorage.getItem('otime_favs') || '[]');
    var currentFilter = 'all';
    var selectedDate = null;
    var currentCalMonth = 7; // Август (0-индекс)
    var currentCalYear = 2026;

    var monthNames = ["Январь", "Февраль", "Март", "Апрель", "Май", "Июнь", "Июль", "Август", "Сентябрь", "Октябрь", "Ноябрь", "Декабрь"];

    var icons = {
      run: 'fa-person-running',
      ski: 'fa-person-skiing',
      swim: 'fa-person-swimming',
      bike: 'fa-person-biking',
      other: 'fa-trophy'
    };

    function openSidebar() {
      document.getElementById('sidebar').classList.add('active');
      document.getElementById('overlay').classList.add('active');
    }

    function closeSidebar() {
      document.getElementById('sidebar').classList.remove('active');
      document.getElementById('overlay').classList.remove('active');
    }

    function changeMonth(delta) {
      currentCalMonth += delta;
      if (currentCalMonth > 11) {
        currentCalMonth = 0;
        currentCalYear++;
      } else if (currentCalMonth < 0) {
        currentCalMonth = 11;
        currentCalYear--;
      }
      renderCalendarGrid();
    }

    function renderCalendarGrid() {
      var grid = document.getElementById('calendar-grid');
      var titleEl = document.getElementById('month-title');
      if (!grid || !titleEl) return;

      titleEl.textContent = monthNames[currentCalMonth] + " " + currentCalYear;

      var daysNames = ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'];
      var html = "";
      
      for (var d = 0; d < daysNames.length; d++) {
        html += '<div class="cal-day-name">' + daysNames[d] + '</div>';
      }

      var firstDay = new Date(currentCalYear, currentCalMonth, 1).getDay();
      var emptySlots = (firstDay === 0 ? 6 : firstDay - 1);
      var daysInMonth = new Date(currentCalYear, currentCalMonth + 1, 0).getDate();

      for (var i = 0; i < emptySlots; i++) {
        html += '<div class="cal-date empty"></div>';
      }

      for (var day = 1; day <= daysInMonth; day++) {
        var mStr = (currentCalMonth + 1) < 10 ? '0' + (currentCalMonth + 1) : (currentCalMonth + 1);
        var dStr = day < 10 ? '0' + day : day;
        var dateStr = currentCalYear + '-' + mStr + '-' + dStr;

        var dayEvents = eventsData.filter(function(e) { return e.date === dateStr; });
        var hasEvents = dayEvents.length > 0;
        var isSelected = selectedDate === dateStr;

        var dotsHtml = "";
        for (var k = 0; k < dayEvents.length; k++) {
          dotsHtml += '<div class="event-dot"></div>';
        }

        html += '<div class="cal-date ' + (hasEvents ? 'has-events' : '') + ' ' + (isSelected ? 'selected' : '') + '" onclick="selectDate(\'' + dateStr + '\')">' +
                '<span>' + day + '</span>' +
                '<div class="event-dots">' + dotsHtml + '</div>' +
                '</div>';
      }

      grid.innerHTML = html;
    }

    function selectDate(dateStr) {
      if (selectedDate === dateStr) {
        clearDateFilter();
      } else {
        selectedDate = dateStr;
        document.getElementById('reset-date').style.display = 'block';
        document.getElementById('date-info-bar').style.display = 'block';
        document.getElementById('selected-date-text').textContent = dateStr.split('-').reverse().join('.');
      }
      closeSidebar();
      renderCalendarGrid();
      renderEvents();
    }

    function clearDateFilter() {
      selectedDate = null;
      document.getElementById('reset-date').style.display = 'none';
      document.getElementById('date-info-bar').style.display = 'none';
      renderCalendarGrid();
      renderEvents();
    }

    function toggleFavorite(id) {
      if (favorites.indexOf(id) !== -1) {
        favorites = favorites.filter(function(favId) { return favId !== id; });
      } else {
        favorites.push(id);
      }
      localStorage.setItem('otime_favs', JSON.stringify(favorites));
      updateFavBadge();
      renderEvents();
    }

    function updateFavBadge() {
      var el = document.getElementById('fav-count');
      if (el) el.textContent = favorites.length;
    }

    function renderEvents() {
      var container = document.getElementById('events-grid');
      if (!container) return;

      var filtered = eventsData.slice();

      if (currentFilter === 'favorites') {
        filtered = filtered.filter(function(e) { return favorites.indexOf(e.id) !== -1; });
      } else if (currentFilter !== 'all') {
        filtered = filtered.filter(function(e) { return e.type === currentFilter; });
      }

      if (selectedDate) {
        filtered = filtered.filter(function(e) { return e.date === selectedDate; });
      }

      filtered.sort(function(a, b) { return new Date(a.date) - new Date(b.date); });

      if (filtered.length === 0) {
        container.innerHTML = '<div class="empty-msg" style="grid-column: 1/-1;">Мероприятий по выбранным параметрам не найдено.</div>';
        return;
      }

      var html = "";
      for (var i = 0; i < filtered.length; i++) {
        var event = filtered[i];
        var isFav = favorites.indexOf(event.id) !== -1;
        var iconClass = icons[event.type] || 'fa-trophy';
        var formattedDate = event.date.split('-').reverse().join('.');

        html += '<div class="event-card">' +
                  '<div class="card-banner banner-' + event.type + '">' +
                    '<i class="fa-solid ' + iconClass + '"></i>' +
                    '<button class="fav-btn ' + (isFav ? 'is-fav' : '') + '" onclick="toggleFavorite(\'' + event.id + '\')">' +
                      '<i class="' + (isFav ? 'fa-solid' : 'fa-regular') + ' fa-heart"></i>' +
                    '</button>' +
                  '</div>' +
                  '<div class="card-body">' +
                    '<div>' +
                      '<div class="card-meta">' +
                        '<span class="event-date-badge">' + formattedDate + '</span>' +
                        '<span class="event-source">' + event.source + '</span>' +
                      '</div>' +
                      '<div class="event-title">' +
