<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Планы на спорт</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --card-bg-hover: #334155;
      
      --text-primary: #f8fafc;
      --text-secondary: #cbd5e1;
      --text-muted: #64748b;
      
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --accent-light: rgba(99, 102, 241, 0.2);
      
      --danger: #f43f5e;
      --danger-light: rgba(244, 63, 94, 0.2);
      
      --border-color: #334155;
      --radius: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-primary);
      padding: 16px;
      min-height: 100vh;
      line-height: 1.5;
      overflow-x: hidden;
    }

    .app-container {
      max-width: 1100px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Шапка сайта */
    header {
      background: var(--card-bg);
      padding: 14px 20px;
      border-radius: var(--radius);
      border: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .menu-toggle-btn {
      background: var(--border-color);
      border: none;
      color: var(--text-primary);
      padding: 8px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: background 0.2s;
    }

    .menu-toggle-btn:hover {
      background: var(--accent);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 800;
      font-size: 1.2rem;
      color: var(--text-primary);
      letter-spacing: -0.3px;
    }

    .logo i {
      color: var(--accent);
    }

    /* Выдвижная боковая панель (Sidebar) */
    .sidebar-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(4px);
      z-index: 99;
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s ease;
    }

    .sidebar-overlay.active {
      opacity: 1;
      visibility: visible;
    }

    .sidebar {
      position: fixed;
      top: 0;
      left: -340px;
      width: 320px;
      height: 100%;
      background: var(--card-bg);
      border-right: 1px solid var(--border-color);
      z-index: 100;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      transition: left 0.3s ease;
      box-shadow: 5px 0 25px rgba(0,0,0,0.5);
    }

    .sidebar.active {
      left: 0;
    }

    .sidebar-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 12px;
    }

    .sidebar-title {
      font-weight: 700;
      font-size: 1.1rem;
      color: var(--text-primary);
    }

    .close-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 1.2rem;
      cursor: pointer;
    }

    .close-btn:hover {
      color: var(--text-primary);
    }

    /* Календарная сетка в Sidebar */
    .month-title {
      font-weight: 700;
      font-size: 0.95rem;
      color: var(--text-secondary);
      margin-bottom: 10px;
    }

    .cal-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
      text-align: center;
    }

    .cal-day-name {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--text-muted);
      padding: 4px 0;
    }

    .cal-date {
      aspect-ratio: 1;
      padding: 4px;
      border-radius: 8px;
      border: 1px solid transparent;
      background: #0f172a;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-secondary);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      transition: all 0.15s ease;
    }

    .cal-date:hover {
      border-color: var(--accent);
      background: var(--accent-light);
      color: #fff;
    }

    .cal-date.empty {
      background: transparent;
      cursor: default;
    }

    .cal-date.has-events {
      border-color: var(--border-color);
      color: #fff;
    }

    .cal-date.selected {
      background: var(--accent) !important;
      color: #ffffff !important;
    }

    .event-dots {
      display: flex;
      gap: 2px;
      margin-top: 2px;
    }

    .event-dot {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background-color: var(--accent);
    }

    .cal-date.selected .event-dot {
      background-color: #ffffff;
    }

    .reset-date-btn {
      width: 100%;
      background: var(--border-color);
      border: none;
      color: var(--text-primary);
      padding: 8px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.85rem;
      margin-top: 10px;
    }

    /* Панель фильтров видов спорта */
    .controls {
      background: var(--card-bg);
      padding: 12px;
      border-radius: var(--radius);
      border: 1px solid var(--border-color);
    }

    .filters-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .filter-btn {
      background: #0f172a;
      border: 1px solid var(--border-color);
      color: var(--text-secondary);
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.85rem;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }

    .filter-btn:hover {
      background: var(--card-bg-hover);
      color: var(--text-primary);
    }

    .filter-btn.active {
      background: var(--accent);
      color: #ffffff;
      border-color: var(--accent);
    }

    .filter-btn.favorites-tab {
      margin-left: auto;
      color: var(--danger);
      background: var(--danger-light);
      border-color: transparent;
    }

    .filter-btn.favorites-tab.active {
      background: var(--danger);
      color: #ffffff;
    }

    .badge {
      background: rgba(255, 255, 255, 0.2);
      padding: 2px 6px;
      border-radius: 6px;
      font-size: 0.75rem;
    }

    /* Индикатор выбранного дня */
    .active-date-info {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--accent-light);
      border: 1px solid var(--accent);
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 0.88rem;
      color: var(--text-primary);
    }

    /* Сетка карточек */
    .events-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
    }

    .event-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }

    .event-card:hover {
      transform: translateY(-2px);
      border-color: var(--accent);
    }

    /* Баннеры карточек */
    .card-banner {
      height: 90px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      font-size: 2.2rem;
    }

    .banner-run { background: linear-gradient(135deg, #4f46e5, #3b82f6); }
    .banner-ski { background: linear-gradient(135deg, #0284c7, #06b6d4); }
    .banner-swim { background: linear-gradient(135deg, #0d9488, #10b981); }
    .banner-bike { background: linear-gradient(135deg, #d97706, #f59e0b); }
    .banner-other { background: linear-gradient(135deg, #475569, #64748b); }

    .fav-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(15, 23, 42, 0.75);
      border: none;
      color: var(--text-muted);
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      backdrop-filter: blur(4px);
      transition: all 0.2s ease;
    }

    .fav-btn:hover {
      transform: scale(1.1);
      background: var(--card-bg);
    }

    .fav-btn.is-fav {
      color: var(--danger);
    }

    .card-body {
      padding: 14px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
      justify-content: space-between;
      gap: 12px;
    }

    .event-date-badge {
      background: var(--accent-light);
      color: #818cf8;
      font-weight: 700;
      font-size: 0.8rem;
      padding: 3px 8px;
      border-radius: 6px;
      display: inline-block;
    }

    .event-title {
      font-size: 0.98rem;
      font-weight: 700;
      color: var(--text-primary);
      line-height: 1.35;
      margin-top: 6px;
    }

    .event-location {
      font-size: 0.82rem;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .register-btn {
      display: block;
      text-align: center;
      background: var(--accent);
      color: #ffffff;
      padding: 9px 12px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.85rem;
      transition: background 0.2s ease;
    }

    .register-btn:hover {
      background: var(--accent-hover);
    }

    .empty-msg {
      text-align: center;
      padding: 40px;
      background: var(--card-bg);
      border-radius: var(--radius);
      border: 1px solid var(--border-color);
      color: var(--text-secondary);
    }
  </style>
</head>
<body>

  <!-- Затеменение фона при открытом меню -->
  <div class="sidebar-overlay" id="overlay"></div>

  <!-- Боковое меню с календарем -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-title"><i class="fa-regular fa-calendar-days"></i> Календарь</div>
      <button class="close-btn" id="close-sidebar"><i class="fa-solid fa-xmark"></i></button>
    </div>

    <div>
      <div class="month-title">Август 2026</div>
      <div class="cal-grid" id="calendar-grid"></div>
      <button class="reset-date-btn" id="reset-date" style="display: none;">Показать все дни</button>
    </div>
  </aside>

  <!-- Основной контент -->
  <div class="app-container">
    <header>
      <div class="header-left">
        <button class="menu-toggle-btn" id="open-sidebar">
          <i class="fa-solid fa-bars"></i>
          <span>Календарь</span>
        </button>
        <div class="logo">
          <i class="fa-solid fa-stopwatch"></i>
          <span>Планы на спорт</span>
        </div>
      </div>
    </header>

    <!-- Выбранная дата (если активна) -->
    <div id="date-info-bar" style="display: none;">
      <div class="active-date-info">
        <span>Показаны старты на: <strong id="selected-date-text"></strong></span>
        <button class="close-btn" onclick="clearDateFilter()"><i class="fa-solid fa-xmark"></i></button>
      </div>
    </div>

    <!-- Фильтры по видам спорта -->
    <div class="controls">
      <div class="filters-row" id="sport-filters">
        <button class="filter-btn active" data-type="all">
          <i class="fa-solid fa-border-all"></i> Все
        </button>
        <button class="filter-btn" data-type="run">
          <i class="fa-solid fa-person-running"></i> Бег / Трейл
        </button>
        <button class="filter-btn" data-type="ski">
          <i class="fa-solid fa-person-skiing"></i> Лыжи
        </button>
        <button class="filter-btn" data-type="swim">
          <i class="fa-solid fa-person-swimming"></i> Плавание
        </button>
        <button class="filter-btn" data-type="bike">
          <i class="fa-solid fa-person-biking"></i> Вело
        </button>
        <button class="filter-btn" data-type="other">
          <i class="fa-solid fa-trophy"></i> Другое
        </button>
        <button class="filter-btn favorites-tab" data-type="favorites">
          <i class="fa-solid fa-heart"></i> Избранное <span class="badge" id="fav-count">0</span>
        </button>
      </div>
    </div>

    <!-- Список соревнований -->
    <main id="events-container">
      <div class="events-grid" id="events-grid"></div>
    </main>
  </div>

  <script>
    const eventsData = [
      { id: 'ev1', title: "Марафон «Европа-Азия»", date: "2026-08-15", location: "Екатеринбург", type: "run", link: "https://reg.o-time.ru/calendar" },
      { id: 'ev2', title: "Лесной трейл «Небо Славян»", date: "2026-08-20", location: "Ленинградская обл.", type: "run", link: "https://reg.o-time.ru/calendar" },
      { id: 'ev3', title: "Ночной забег O-Time", date: "2026-08-20", location: "Санкт-Петербург", type: "run", link: "https://reg.o-time.ru/calendar" },
      { id: 'ev4', title: "Открытый заплыв Lake Swim", date: "2026-08-23", location: "Озеро Хепоярви", type: "swim", link: "https://reg.o-time.ru/calendar" },
      { id: 'ev5', title: "Шоссейная велогонка Gran Fondo", date: "2026-08-28", location: "Москва", type: "bike", link: "https://reg.o-time.ru/calendar" },
      { id: 'ev6', title: "Лыжероллерный спринт", date: "2026-08-30", location: "Кавголово", type: "ski", link: "https://reg.o-time.ru/calendar" }
    ];

    let favorites = JSON.parse(localStorage.getItem('otime_favs') || '[]');
    let currentFilter = 'all';
    let selectedDate = null;

    const icons = {
      run: 'fa-person-running',
      ski: 'fa-person-skiing',
      swim: 'fa-person-swimming',
      bike: 'fa-person-biking',
      other: 'fa-trophy'
    };

    function init() {
      setupSidebar();
      updateFavBadge();
      renderCalendarGrid();
      renderEvents();
    }

    // Управление боковой панелью
    function setupSidebar() {
      const sidebar = document.getElementById('sidebar');
      const overlay = document.getElementById('overlay');
      const openBtn = document.getElementById('open-sidebar');
      const closeBtn = document.getElementById('close-sidebar');

      function openSidebar() {
        sidebar.classList.add('active');
        overlay.classList.add('active');
      }

      function closeSidebar() {
        sidebar.classList.remove('active');
        overlay.classList.remove('active');
      }

      openBtn.addEventListener('click', openSidebar);
      closeBtn.addEventListener('click', closeSidebar);
      overlay.addEventListener('click', closeSidebar);

      // Жест свайпа слева направо для открытия на смартфонах
      let touchStartX = 0;
      document.addEventListener('touchstart', e => touchStartX = e.touches[0].clientX);
      document.addEventListener('touchend', e => {
        if (touchStartX < 30 && e.changedTouches[0].clientX > 80) openSidebar();
      });
    }

    // Сетка календаря
    function renderCalendarGrid() {
      const grid = document.getElementById('calendar-grid');
      const daysNames = ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'];
      let html = daysNames.map(d => `<div class="cal-day-name">${d}</div>`).join('');

      for (let i = 0; i < 5; i++) {
        html += `<div class="cal-date empty"></div>`;
      }

      for (let day = 1; day <= 31; day++) {
        const dateStr = `2026-08-${day < 10 ? '0' + day : day}`;
        const dayEvents = eventsData.filter(e => e.date === dateStr);
        const hasEvents = dayEvents.length > 0;
        const isSelected = selectedDate === dateStr;

        html += `
          <div class="cal-date ${hasEvents ? 'has-events' : ''} ${isSelected ? 'selected' : ''}" 
               onclick="selectDate('${dateStr}')">
            <span>${day}</span>
            <div class="event-dots">
              ${dayEvents.map(() => `<div class="event-dot"></div>`).join('')}
            </div>
          </div>
        `;
      }

      grid.innerHTML = html;
    }

    function selectDate(dateStr) {
      if (selectedDate === dateStr) {
        clearDateFilter();
      } else {
        selectedDate = dateStr;
        document.getElementById('reset-date').style.display = 'block';
        document.getElementById('date-info-bar').style.display = 'block';
        document.getElementById('selected-date-text').textContent = dateStr.split('-').reverse().join('.');
      }
      
      // Закрываем панель после выбора даты
      document.getElementById('sidebar').classList.remove('active');
      document.getElementById('overlay').classList.remove('active');

      renderCalendarGrid();
      renderEvents();
    }

    function clearDateFilter() {
      selectedDate = null;
      document.getElementById('reset-date').style.display = 'none';
      document.getElementById('date-info-bar').style.display = 'none';
      renderCalendarGrid();
      renderEvents();
    }

    document.getElementById('reset-date').addEventListener('click', clearDateFilter);

    function toggleFavorite(id) {
      if (favorites.includes(id)) {
        favorites = favorites.filter(favId => favId !== id);
      } else {
        favorites.push(id);
      }
      localStorage.setItem('otime_favs', JSON.stringify(favorites));
      updateFavBadge();
      renderEvents();
    }

    function updateFavBadge() {
      document.getElementById('fav-count').textContent = favorites.length;
    }

    function renderEvents() {
      const container = document.getElementById('events-grid');
      let filtered = [...eventsData];

      if (currentFilter === 'favorites') {
        filtered = filtered.filter(e => favorites.includes(e.id));
      } else if (currentFilter !== 'all') {
        filtered = filtered.filter(e => e.type === currentFilter);
      }

      if (selectedDate) {
        filtered = filtered.filter(e => e.date === selectedDate);
      }

      filtered.sort((a, b) => new Date(a.date) - new Date(b.date));

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="empty-msg" style="grid-column: 1/-1;">
            Мероприятий по выбранным параметрам не найдено.
          </div>
        `;
        return;
      }

      container.innerHTML = filtered.map(event => {
        const isFav = favorites.includes(event.id);
        const iconClass = icons[event.type] || 'fa-trophy';
        const formattedDate = event.date.split('-').reverse().join('.');

        return `
          <div class="event-card">
            <div class="card-banner banner-${event.type}">
              <i class="fa-solid ${iconClass}"></i>
              <button class="fav-btn ${isFav ? 'is-fav' : ''}" onclick="toggleFavorite('${event.id}')">
                <i class="${isFav ? 'fa-solid' : 'fa-regular'} fa-heart"></i>
              </button>
            </div>
            <div class="card-body">
              <div>
                <span class="event-date-badge">${formattedDate}</span>
                <div class="event-title">${event.title}</div>
              </div>
              <div class="event-location">
                <i class="fa-solid fa-location-dot"></i> ${event.location}
              </div>
              <a href="${event.link}" target="_blank" class="register-btn">Регистрация</a>
            </div>
          </div>
        `;
      }).join('');
    }

    document.getElementById('sport-filters').addEventListener('click', (e) => {
      const btn = e.target.closest('.filter-btn');
      if (!btn) return;

      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');

      currentFilter = btn.dataset.type;
      renderEvents();
    }
